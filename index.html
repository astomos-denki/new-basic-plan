<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="アストモスでんき 共通ページテンプレート">
<title>アストモスでんき</title>
<style>

/* =========================================================
   アストモスでんき 新ベーシックプラン LP
   色・文字サイズ・余白は、まずこの設定一覧から変更できます。
   ========================================================= */
:root {
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", Meiryo, sans-serif;
  --page-bg: #ffffff; --text: #222222; --muted: #555555; --content-width: 1100px;
  --orange: #eaa527; --orange-dark: #c65d16; --orange-pale: #fff0d9; --orange-light: #fff7ef;
  --border: #f0d8c5; --topbar-bg: #eaa527; --topbar-text: #ffffff;
  --header-bg: #ffffff; --header-height: 76px; --logo-color: #eaa527;
  --hero-start: #eaa527; --hero-middle: #eaa527; --hero-end: #eaa527;
  --hero-title-color: #ffffff; --hero-text-color: #ffffff; --hero-padding-y: 76px;
  --section-padding-y: 70px; --section-heading-color: #eaa527; --section-eyebrow-color: #c65d16;
  --card-bg: #ffffff; --card-border: #f7b97a; --card-radius: 18px;
  --flow-bg: #faf9f6; --flow-icon-color: #eaa527;
  --price-section-bg: #ffffff; --price-table-border: #ead9c2;
  /* 料金表：アストモス列を強調 */
  --price-table-astomos-bg: #fff0d9;
  --price-table-astomos-text: #a84e08;
  --price-table-astomos-heading: #e58b24;
  --price-table-competitor-bg: #ffffff;
  --price-table-competitor-text: #4b5563;
  --price-table-competitor-heading: #667085;
  --price-table-label-bg: #f4f1ec;
  --price-table-note-bg: #fffaf3; --price-table-note-text: #715b2b; --price-table-note-border: #eaa527;
  --button-bg: #eaa527; --button-text: #ffffff; --button-radius: 999px;
  --faq-bg: #fff7ef; --cta-bg-start: #eaa527; --cta-bg-end: #eaa527;
  --footer-bg: #ffffff; --footer-text: #222222;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: var(--font); color: var(--text); background: var(--page-bg); font-size: 16px; line-height: 1.8; }
a { color: inherit; }
.wrap { width: min(var(--content-width), 92%); margin: 0 auto; }
.topbar { padding: 8px 0; background: var(--topbar-bg); color: var(--topbar-text); font-size: 13px; line-height: 1.6; }
.topbar .wrap { display: flex; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap; }
.header { background: var(--header-bg); border-bottom: 1px solid var(--border); }
.header-inner { min-height: var(--header-height); display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.brand { display:flex; align-items:center; flex:0 1 auto; min-width:0; text-decoration:none; line-height:1; }
.brand-logo { display:block; width:268px; max-width:100%; height:auto; object-fit:contain; }
.brand small { display:none; }
.nav { display: flex; align-items: center; gap: 20px; font-size: 13px; }
.nav a { text-decoration: none; color: #555; }
.nav .nav-cta { padding: 9px 15px; color: #fff; background: var(--button-bg); border-radius: var(--button-radius); font-weight: 700; }
.hero { position: relative; overflow: hidden; background: linear-gradient(120deg,var(--hero-start),var(--hero-middle) 52%,var(--hero-end)); }
.hero:after { content: ""; position: absolute; width: 390px; height: 390px; border-radius: 50%; background: rgba(255,255,255,.35); right: -110px; top: -130px; }
.hero-inner { position: relative; z-index: 1; display: grid; grid-template-columns: 1.2fr .8fr; gap: 40px; align-items: center; padding: var(--hero-padding-y) 0; }
.pill { display: inline-block; padding: 5px 13px; border: 1px solid var(--orange); border-radius: 999px; background: #fff; color: var(--orange); font-size: 12px; font-weight: 700; }
.eyebrow { color: var(--section-eyebrow-color); font-size: 13px; font-weight: 800; letter-spacing: .13em; }
.hero .eyebrow { margin-top: 18px; color: #c65d16; }
.hero h1 { margin: 14px 0 20px; color: var(--hero-title-color); font-size: clamp(34px,5vw,54px); font-weight: 800; line-height: 1.28; letter-spacing: .02em; }
.hero-copy { max-width: 620px; margin: 0 0 25px; color: var(--hero-text-color); }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 23px; border-radius: var(--button-radius); font-size: 14px; font-weight: 800; text-decoration: none; transition: transform .2s, box-shadow .2s; }
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: #fff; color: var(--orange); border: 1px solid var(--orange); box-shadow: 0 7px 16px rgba(232,117,34,.16); }
.btn-secondary { background: #ffffff; color: var(--orange); border: 1px solid var(--orange); }
.hero-card { padding: 28px; border: 1px solid rgba(255,255,255,.9); border-radius: 24px; background: rgba(255,255,255,.92); box-shadow: 0 16px 45px rgba(16,47,80,.08); }
.hero-card .symbol { display: grid; place-items: center; width: 56px; height: 56px; margin-bottom: 15px; border-radius: 16px; background: #fff0df; color: var(--orange-dark); font-size: 28px; }
.hero-card h2 { margin: 0 0 8px; color: var(--orange); font-size: 21px; line-height: 1.4; }
.hero-card p { margin: 0; color: var(--muted); font-size: 14px; }
section { padding: var(--section-padding-y) 0; }
.section-head { max-width: 700px; margin: 0 auto 34px; text-align: center; }
.section-head .eyebrow { margin-bottom: 8px; }
.section-head h2 { margin: 0 0 12px; color: var(--section-heading-color); font-size: clamp(26px,3.4vw,36px); font-weight: 800; line-height: 1.4; }
.section-head p { margin: 0; color: var(--muted); }
#features { background: #fff; }
.features { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 18px; }
.feature { padding: 25px; border: 1px solid var(--card-border); border-radius: var(--card-radius); background: var(--card-bg); }
.feature .num { display: grid; place-items: center; width: 42px; height: 42px; margin-bottom: 16px; border-radius: 13px; background: #fff7ed; color: var(--orange-dark); font-size: 16px; font-weight: 900; }
.feature h3 { margin: 0 0 8px; color: var(--orange); font-size: 18px; line-height: 1.5; }
.feature p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
#flow { padding: 34px 0 40px; background: var(--flow-bg); }
#flow .section-head { max-width: 100%; margin-bottom: 30px; }
#flow .section-head h2 { display: inline-block; margin: 0; padding-bottom: 5px; border-bottom: 2px dotted var(--orange); color: var(--orange); font-size: clamp(25px,3vw,34px); }
#flow .section-head .eyebrow, #flow .section-head p { display: none; }
.flow { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 24px; align-items: start; }
.flow-item { position: relative; min-width: 0; padding: 0; text-align: center; }
.flow-item:before { content: attr(data-step); display: block; margin-bottom: 12px; color: var(--orange); font-size: 14px; font-weight: 500; }
.flow-icon { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 155px; height: 126px; margin: 0 auto 10px; border-radius: 16px; background: #fff; }
.flow-icon svg { width: 50px; height: 50px; fill: none; stroke: var(--flow-icon-color); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.flow-item p { max-width: 175px; margin: 0 auto; color: #222; font-size: 14px; line-height: 1.8; overflow-wrap: anywhere; }
.flow-item:not(:last-child)::after { content: ""; position: absolute; top: 47px; right: -20px; width: 11px; height: 11px; border-top: 4px solid #111; border-right: 4px solid #111; transform: rotate(45deg); }
.disclaimer { margin-top: 20px; color: var(--muted); font-size: 12px; line-height: 1.7; }
#price { background: var(--price-section-bg); }
#price .section-head p { font-size: 16px; }
.price-comparison { width: 100%; max-width: 1000px; margin: 0 auto; }
.price-table-scroll { width: 100%; overflow: hidden; border: 1px solid var(--price-table-border); border-radius: 10px; background: #fff; }
.price-comparison table { width: 100%; min-width: 0; table-layout: fixed; border-collapse: separate; border-spacing: 0; color: #333; font-size: 14px; line-height: 1.5; }
.price-comparison col.category-col { width: 12%; }
.price-comparison col.item-col { width: 23%; }
.price-comparison col.company-col { width: 32.5%; }
.price-comparison th, .price-comparison td { padding: 13px 12px; border-right: 1px solid var(--price-table-border); border-bottom: 1px solid var(--price-table-border); vertical-align: middle; overflow-wrap: anywhere; }
.price-comparison tr > *:last-child { border-right: none; }
.price-comparison tbody tr:last-child > * { border-bottom: none; }
.price-comparison thead th { background: var(--price-table-competitor-heading); color: #fff; font-size: 15px; font-weight: 700; text-align: center; }
.price-comparison thead th:first-child { background: #f4f1ec; color: #4b5563; }
.price-comparison thead th.price-main-heading { background: var(--price-table-astomos-heading); color: #fff; font-weight: 800; }
.price-comparison thead th.price-competitor-heading { background: var(--price-table-competitor-heading); color: #fff; }
.price-comparison .price-category { background: #fff5e8; color: #754b1b; text-align: center; font-weight: 700; }
.price-comparison .price-item { background: #f8f7f5; color: #333; text-align: left; font-weight: 600; }
.price-comparison .price-value { text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.price-comparison .price-main { background: var(--price-table-astomos-bg); color: var(--price-table-astomos-text); font-weight: 800; font-size: 1.05em; }
.price-comparison .price-competitor { background: var(--price-table-competitor-bg); color: var(--price-table-competitor-text); font-weight: 500; }
.price-table-notes { margin-top: 18px; padding: 14px 16px; background: var(--price-table-note-bg); border-left: 4px solid var(--price-table-note-border); border-radius: 0 10px 10px 0; color: var(--price-table-note-text); font-size: 12px; line-height: 1.8; }
.price-table-notes p { margin: 0 0 6px; }
.price-table-notes p:last-child { margin-bottom: 0; }
.price-comparison-action { margin-top: 26px; text-align: center; }
#price .price-comparison-action .btn { background: var(--button-bg); color: var(--button-text); border: 1px solid var(--button-bg); }
#faq { background: var(--faq-bg); }
.faq { max-width: 850px; margin: 0 auto; }
.faq details { padding: 18px 4px; border-bottom: 1px solid var(--border); }
.faq summary { cursor: pointer; color: #555; font-size: 16px; font-weight: 800; }
.faq details p { margin: 10px 0 0; color: #555; font-size: 14px; line-height: 1.8; }
.cta-band { padding: 58px 20px; background: linear-gradient(115deg,var(--cta-bg-start),var(--cta-bg-end)); text-align: center; }
.cta-band h2 { margin: 0 0 12px; color: #fff; font-size: clamp(25px,3vw,34px); font-weight: 800; line-height: 1.4; }
.cta-band p { max-width: 650px; margin: 0 auto 25px; color: #ffead8; }
.cta-band .btn { background: #fff; color: var(--orange); border: 1px solid #fff; }
.footer { padding: 28px 0; background: var(--footer-bg); color: var(--footer-text); font-size: 12px; }
.footer-inner { display: flex; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }


/* 特定商取引法に基づく表記：参考画像に合わせた表形式 */
#legal-disclosure { padding: 48px 0 12px; background: #f7f7f5; }
#legal-disclosure .section-head { margin-bottom: 22px; }
#legal-disclosure .section-head h2 { display: inline-block; padding-bottom: 5px; border-bottom: 1px dotted var(--orange); }
.legal-panel { padding: 8px; background: #fff; border-radius: 4px; box-shadow: 0 1px 8px rgba(0,0,0,.025); }
.legal-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; line-height: 1.65; }
.legal-table th, .legal-table td { padding: 7px 14px; border-bottom: 1px dotted #eaa527; vertical-align: middle; text-align: left; overflow-wrap: anywhere; }
.legal-table th { width: 175px; color: #fff; background: #eaa527; text-align: center; font-weight: 600; border-radius: 3px; }
.legal-table td { color: #444; }
.legal-table strong { color: #222; }
.legal-table a { color: inherit; text-decoration: underline; }
@media (max-width: 600px) {
  #legal-disclosure { padding: 38px 0 8px; }
  .legal-panel { padding: 7px; }
  .legal-table, .legal-table tbody, .legal-table tr, .legal-table th, .legal-table td { display: block; width: 100%; }
  .legal-table tr { margin-bottom: 10px; border-bottom: 1px dotted #eaa527; }
  .legal-table th { padding: 7px 10px; border-radius: 3px; }
  .legal-table td { padding: 8px 10px; border-bottom: 0; font-size: 13px; }
}

/* タブレット */
@media (max-width: 900px) {
  .nav { gap: 12px; }
  .nav a:not(.nav-cta) { display: none; }
  .hero-inner { gap: 24px; }
  .features { gap: 12px; }
  .feature { padding: 20px; }
  .flow { grid-template-columns: repeat(3,minmax(0,1fr)); row-gap: 30px; column-gap: 18px; }
  .flow-item:not(:last-child)::after { display: none; }
}

/* スマートフォン：手順は横にスワイプ、料金表は縦型カードに変換 */
@media (max-width: 600px) {
  body { font-size: 15px; }
  .wrap { width: 92%; }
  .topbar { font-size: 11px; }
  .topbar .wrap { gap: 2px 8px; }
  .topbar .wrap span:last-child { display: none; }
  .header-inner { min-height: 66px; gap: 8px; }
  .brand-logo { width:clamp(130px,36vw,210px); }
  .nav .nav-cta { padding: 9px 11px; font-size: 11px; white-space: nowrap; }
  .hero-inner { grid-template-columns: 1fr; padding: 48px 0; gap: 26px; }
  .hero h1 { font-size: clamp(32px,9vw,42px); }
  .hero-copy { font-size: 14px; }
  .hero-card { max-width: 480px; padding: 22px; border-radius: 18px; }
  .btn-row { flex-direction: column; align-items: stretch; }
  .btn-row .btn { width: 100%; }
  section { padding: 48px 0; }
  .section-head { margin-bottom: 25px; }
  .section-head h2 { font-size: 26px; }
  .section-head p { font-size: 14px; }
  .features { grid-template-columns: 1fr; gap: 12px; }
  .feature { padding: 20px; }
  #flow { padding: 36px 0; }
  #flow .section-head { margin-bottom: 24px; }
  #flow .section-head h2 { font-size: 23px; }
  /* 横並びの手順：スクロールバーを出さず、右へスワイプ */
  #flow .flow { display: flex; gap: 14px; overflow-x: auto; overflow-y: hidden; padding: 2px 2px 12px; margin: 0 -1px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  #flow .flow-item { flex: 0 0 72%; max-width: 250px; scroll-snap-align: start; }
  #flow .flow-item:before { font-size: 13px; margin-bottom: 8px; }
  #flow .flow-icon { height: 110px; max-width: 100%; margin-bottom: 10px; border-radius: 14px; }
  #flow .flow-icon svg { width: 43px; height: 43px; }
  #flow .flow-item p { max-width: 100%; font-size: 13px; }
  #flow .flow-item:not(:last-child)::after { display: block; top: 47px; right: -9px; width: 8px; height: 8px; border-width: 3px; }
  #flow .disclaimer { font-size: 11px; }
  #price { padding: 44px 0; }
  #price .section-head { margin-bottom: 24px; }
  #price .section-head h2 { font-size: 27px; }
  #price .section-head p { font-size: 14px; }
  .price-table-scroll { overflow: visible; border: none; border-radius: 0; background: transparent; }
  .price-comparison table { display: block; width: 100%; min-width: 0; font-size: 13px; }
  .price-comparison colgroup, .price-comparison thead { display: none; }
  .price-comparison tbody { display: grid; grid-template-columns: minmax(0,1fr); gap: 12px; }
  .price-comparison tbody tr { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); overflow: hidden; border: 1px solid #e7e2dc; border-radius: 12px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.035); }
  .price-comparison tbody tr > * { min-width: 0; border: none; }
  /* rowspanの料金区分セルはスマホでは非表示。項目名に内容を表示 */
  .price-comparison tbody td.price-category { display: none; }
  .price-comparison tbody td.price-item { grid-column: 1 / -1; padding: 11px 13px; background: var(--price-table-label-bg); border-bottom: 1px solid #e7e2dc; font-size: 13px; font-weight: 800; }
  .price-comparison tbody td.price-value { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; min-height: 78px; padding: 11px 5px; text-align: center; white-space: normal; }
  .price-comparison tbody td.price-value::before { content: attr(data-label); display: block; font-size: 10px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
  .price-comparison tbody td.price-main { background: var(--price-table-astomos-bg); color: var(--price-table-astomos-text); font-size: 15px; font-weight: 800; border-right: 1px solid #f0d8c5; }
  .price-comparison tbody td.price-main::before { color: var(--price-table-astomos-text); }
  .price-comparison tbody td.price-competitor { background: var(--price-table-competitor-bg); color: var(--price-table-competitor-text); font-size: 14px; font-weight: 600; }
  .price-comparison tbody td.price-competitor::before { color: var(--price-table-competitor-text); }
  .price-table-notes { margin-top: 14px; padding: 12px; font-size: 11px; line-height: 1.8; }
  .price-comparison-action { margin-top: 22px; }
  .price-comparison-action .btn { display: flex; width: 100%; max-width: 360px; margin: 0 auto; padding: 14px 12px; line-height: 1.6; }
  #faq { padding: 48px 0; }
  .faq summary { font-size: 14px; }
  .faq details p { font-size: 13px; }
  .cta-band { padding: 44px 0; }
  .cta-band h2 { font-size: 25px; }
  .cta-band p { font-size: 14px; }
  .cta-band .btn { width: 100%; max-width: 360px; }
  .footer-inner { flex-direction: column; gap: 6px; }
}

/* 2026-10-02 調整：スマートフォンでも料金表・特商法表記を表形式でコンパクトに表示 */
.price-apply-action { text-align: center; margin: 0 auto 22px; }
.price-apply-action .btn { display: inline-block; min-width: 220px; text-align: center; }
@media (max-width: 600px) {
  .price-apply-action { margin-bottom: 16px; }
  .price-apply-action .btn { min-width: 0; width: min(100%, 280px); padding: 12px 16px; font-size: 14px; }
  #price .section-head { margin-bottom: 14px; }
  #price .section-head h2 { font-size: 23px; }
  #price .section-head p { font-size: 12px; }
  .price-table-scroll { overflow: hidden !important; border: 1px solid var(--price-table-border) !important; border-radius: 6px !important; background: #fff !important; }
  .price-comparison table { display: table !important; width: 100% !important; min-width: 0 !important; table-layout: fixed !important; border-collapse: collapse !important; font-size: 9px !important; line-height: 1.3 !important; }
  .price-comparison colgroup { display: table-column-group !important; }
  .price-comparison col { display: table-column !important; }
  .price-comparison thead { display: table-header-group !important; }
  .price-comparison tbody { display: table-row-group !important; }
  .price-comparison tr { display: table-row !important; }
  .price-comparison th, .price-comparison td { display: table-cell !important; padding: 4px 2px !important; overflow-wrap: anywhere; word-break: break-word; }
  .price-comparison th { font-size: 8px !important; }
  .price-comparison .price-category { font-size: 8px !important; }
  #legal-disclosure { padding: 26px 0 8px !important; }
  #legal-disclosure .section-head { margin-bottom: 12px !important; }
  #legal-disclosure .section-head h2 { font-size: 20px; }
  .legal-panel { padding: 4px !important; }
  .legal-table { display: table !important; width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; font-size: 9px !important; line-height: 1.3 !important; }
  .legal-table tbody { display: table-row-group !important; }
  .legal-table tr { display: table-row !important; margin: 0 !important; border-bottom: 1px dotted #eaa527; }
  .legal-table th, .legal-table td { display: table-cell !important; padding: 4px 5px !important; font-size: 9px !important; overflow-wrap: anywhere; word-break: break-word; }
  .legal-table th { width: 27% !important; }
}

/* 2026-10-02 追加調整：申込ボタンを申込フロー内へ、スマホ表示を一画面風に整理 */
.flow-apply-action { margin: 24px auto 0; text-align: center; }
.flow-apply-action .btn { min-width: 240px; background: var(--button-bg); color: var(--button-text); border: 1px solid var(--button-bg); }
@media (max-width: 600px) {
  /* 特徴はカードを簡素化し、3つの要点を箇条書き風に */
  #features .features { display: block; }
  #features .feature { display: grid; grid-template-columns: 28px minmax(0,1fr); column-gap: 9px; align-items: start; padding: 12px 2px; border: 0; border-bottom: 1px solid #f0d8c5; border-radius: 0; background: transparent; }
  #features .feature:last-child { border-bottom: 0; }
  #features .feature .num { display: flex; width: 25px; height: 25px; margin: 2px 0 0; border-radius: 50%; font-size: 12px; }
  #features .feature h3 { margin: 0 0 4px; font-size: 15px; line-height: 1.45; }
  #features .feature p { grid-column: 2; font-size: 12px; line-height: 1.55; }
  #features .feature p::first-line { }
  /* お申込みの流れ：横スクロールなしで5ステップを一まとまりに */
  #flow { padding: 28px 0 30px; }
  #flow .section-head { margin-bottom: 16px; }
  #flow .section-head h2 { font-size: 21px; }
  #flow .flow { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 12px 8px; padding: 0; margin: 0; overflow: visible; }
  #flow .flow-item { grid-column: span 2; min-width: 0; max-width: none; padding: 9px 5px 8px; border: 1px solid #eee2d3; border-radius: 10px; background: #fff; }
  #flow .flow-item:nth-child(4) { grid-column: 2 / span 2; }
  #flow .flow-item:nth-child(5) { grid-column: 4 / span 2; }
  #flow .flow-item:before { font-size: 10px; margin-bottom: 5px; font-weight: 800; }
  #flow .flow-icon { height: 48px; width: 48px; max-width: 100%; margin: 0 auto 6px; border-radius: 50%; background: #fff7ef; }
  #flow .flow-icon svg { width: 27px; height: 27px; }
  #flow .flow-item p { font-size: 10px; line-height: 1.45; overflow-wrap: anywhere; }
  #flow .flow-item:not(:last-child)::after { display: none; }
  #flow .disclaimer { margin-top: 10px; font-size: 10px; }
  .flow-apply-action { margin-top: 16px; }
  .flow-apply-action .btn { width: min(100%, 280px); min-width: 0; padding: 11px 14px; font-size: 13px; }
  /* 備考・注記は補助情報として小さめに */
  .price-table-notes { font-size: 10px !important; line-height: 1.55 !important; padding: 9px 10px !important; }
}


/* エリア切替・追加セクション（元HTMLの色・書体を継承） */
.area-control{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.area-current{font-size:13px;font-weight:800;color:var(--orange-dark)}
.area-switch{border:1px solid var(--orange);background:#fff;color:var(--orange-dark);border-radius:999px;padding:7px 13px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.area-picker{border:1px solid var(--border);border-radius:18px;padding:26px;width:min(560px,92vw);max-height:85vh;box-shadow:0 20px 70px #0003}.area-picker::backdrop{background:#0007}.area-picker h2{color:var(--orange);margin:0 0 10px}.area-options{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:15px}.area-options button{padding:12px;border:1px solid var(--border);border-radius:9px;background:#fff;cursor:pointer;font:inherit;font-weight:700}.area-options button[aria-current=true]{background:var(--orange-pale);border-color:var(--orange);color:var(--orange-dark)}.area-picker-close{float:right;border:0;background:transparent;font-size:26px;cursor:pointer}
.area-options button:disabled{color:#a5a5a5;background:#fafafa;border-color:#e0d8d0;cursor:not-allowed;opacity:.72}.area-options button:disabled:hover{transform:none}.area-notice{font-size:13px;color:var(--muted);margin:13px 0 0}.price-pending{color:#7a5a36;font-size:13px;font-weight:600}.price-comparison .price-value{white-space:normal}
.extra-section{background:var(--flow-bg)}.extra-section:nth-of-type(even){background:#fff}.extra-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.extra-card{padding:23px;border:1px solid var(--card-border);border-radius:var(--card-radius);background:#fff}.extra-card h3{margin:0 0 8px;color:var(--orange);font-size:18px}.extra-card p{margin:0;color:var(--muted);font-size:14px}.campaign-highlight{font-size:clamp(27px,4vw,42px);font-weight:800;color:var(--orange-dark);text-align:center}.extra-center{text-align:center}.extra-center p{max-width:740px;margin:10px auto;color:var(--muted)}
@media(max-width:700px){.area-control{gap:5px}.area-current{font-size:11px}.area-switch{padding:5px 8px;font-size:11px}.header-inner{flex-wrap:wrap;padding:8px 0}.extra-grid{grid-template-columns:1fr}.area-options{gap:7px}.area-options button{padding:9px 4px;font-size:13px}}

/* エリア選択：ポップアップではなくヘッダー直下の横長バー */
.area-bar[hidden]{display:none!important}
.area-bar{background:#fffaf5;border-bottom:1px solid #e9dfd5;box-shadow:0 6px 14px rgba(0,0,0,.04);position:relative;z-index:5}
.area-bar-inner{display:flex;align-items:center;gap:20px;padding:18px 0}
.area-bar-title{font-size:14px;line-height:1.5;font-weight:800;flex:0 0 100px}
.area-bar .area-options{display:flex;flex:1;min-width:0;flex-wrap:wrap;gap:8px;margin:0}
.area-bar .area-options button{flex:1 0 69px;min-width:64px;padding:12px 6px;border:1px solid #ded4c9;border-radius:10px;background:#fff;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.area-bar .area-options button[aria-current="true"]{background:#eaa527;border-color:#eaa527;color:#fff}
.area-bar .area-options button:disabled{background:#eee;color:#aaa;border-color:#eee;cursor:not-allowed}
.area-bar-note{flex:0 0 220px;font-size:11px;line-height:1.65;margin:0;padding-left:15px;border-left:2px solid #eaa527;color:#555}

.area-bar-inner{display:block;padding:13px 0 11px}
.area-bar .area-options{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:0;width:100%;margin:0}
.area-bar .area-options button{display:block;flex:none;min-width:0;width:100%;padding:13px 3px 11px;border:0!important;border-radius:0!important;background:transparent!important;color:#555;font-size:14px;font-weight:700;line-height:1.35;box-shadow:none!important;position:relative;cursor:pointer}
.area-bar .area-options button:not(:disabled):hover{color:#c65d16;background:#fff1dd!important}
.area-bar .area-options button[aria-current="true"]{color:#bd590d!important;background:transparent!important}
.area-bar .area-options button[aria-current="true"]::after{content:"";position:absolute;bottom:2px;left:22%;right:22%;height:3px;border-radius:3px;background:#eaa527}
.area-bar .area-options button:disabled{color:#b6b6b6!important;background:transparent!important;opacity:1;cursor:not-allowed}
.area-bar-note{margin:8px 0 0;padding:0;border:0;max-width:none;font-size:11px;line-height:1.5;color:#777;text-align:center}
.area-bar-note br{display:none}
@media(max-width:1050px){.area-bar-inner{display:block;padding:12px 0}.area-bar .area-options{display:grid;grid-template-columns:repeat(10,minmax(0,1fr))}.area-bar-note{padding:0;border:0}}
@media(max-width:650px){.area-bar-inner{padding:10px 0 12px;display:block}.area-bar .area-options{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px 0;width:100%}.area-bar .area-options button{font-size:14px;min-width:0;min-height:44px;padding:12px 2px 10px}.area-bar .area-options button[aria-current="true"]::after{left:24%;right:24%}.area-bar-note{font-size:11px;line-height:1.55;margin:8px 3px 0;text-align:left}}

const AREA_ENABLED = {
  hokkaido: false,
  tohoku: true,
  tokyo: true,
  hokuriku: false,
  chubu: false,
  kansai: false,

const AREA_DATA = {
  hokkaido: { name: '北海道' },
  tohoku:   { name: '東北' },
  tokyo:    { name: '東京' },
  hokuriku: { name: '北陸' },

(function () {
  const areaBar = document.getElementById('area-bar');
  const options = document.getElementById('area-options');
  const currentArea = document.getElementById('current-area');
  const changeArea = document.getElementById('change-area');

  function getAreaFromURL() {
    const q = new URLSearchParams(location.search).get('area');
    if (q && AREA_DATA[q] && AREA_ENABLED[q]) return q;

    const m = location.pathname.match(
      /\/(hokkaido|tohoku|tokyo|hokuriku|chubu|kansai|chugoku|shikoku|kyushu|okinawa)(?:\/|\/index\.html)?$/i
    );

    if (m && AREA_ENABLED[m[1].toLowerCase()]) {
      return m[1].toLowerCase();
    }

    return 'tohoku';
  }

  function renderArea(slug) {
    if (!AREA_ENABLED[slug]) slug = 'tohoku';

    const data = AREA_DATA[slug] || AREA_DATA.tohoku;

    currentArea.textContent = data.name + 'エリア';

    document.title = 'アストモスでんき｜' + data.name + 'エリア';

    options.replaceChildren();

    Object.keys(AREA_DATA).forEach(function (key) {
      const button = document.createElement('button');

      button.type = 'button';
      button.textContent = AREA_DATA[key].name;
      button.setAttribute('aria-current', String(key === slug));
      button.disabled = !AREA_ENABLED[key];
      button.title = button.disabled ? '現在は選択できません' : '';

      button.addEventListener('click', function () {
        if (!AREA_ENABLED[key]) return;

        const url = new URL(location.href);
        url.searchParams.set('area', key);

        history.pushState({ area: key }, '', url.pathname + url.search);

        areaBar.hidden = true;
        changeArea.setAttribute('aria-expanded', 'false');

        renderArea(key);
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      });

      options.appendChild(button);
    });
  }

  changeArea.setAttribute('aria-expanded', 'false');

  changeArea.addEventListener('click', function () {
    areaBar.hidden = !areaBar.hidden;
    changeArea.setAttribute(
      'aria-expanded',
      String(!areaBar.hidden)
    );
  });

  window.addEventListener('popstate', function () {
    renderArea(getAreaFromURL());
  });

  renderArea(getAreaFromURL());
})();
</script>


</body>
</html>
